# Raw data sources manifest
#
# Used by 00_01_download_raw_sources.qmd and 00_02_convert_to_parquet.qmd to:
#   1. Fetch the original files from authoritative sources
#   2. Verify integrity against expected SHA256 hashes
#   3. Convert active files to Parquet format
#   4. Package the originals into 7z archives for audit purposes
#
# Conventions:
#   - All URLs are direct download links to the authoritative source
#     (canonical landing pages are listed in `landing_url` for each source)
#   - Hashes are SHA256 of the original file as downloaded on the date
#     specified in `recorded_on` (one date per source group)
#   - `active: true` files are unpacked into 01_data/01_raw/{SOURCE}/
#     and feed the analytical pipeline
#   - `active: false` files are kept inside the historical 7z only
#     and are not unpacked unless explicitly requested
#
# Manifest version:  2026-05-29

