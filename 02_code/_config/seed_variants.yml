# ==============================================================================
# Seed Variants Configuration
# ==============================================================================
#
# Single source of truth for seed variant parameters used across the New Seed
# biofortification framework. Consumed by parametrized Quarto scripts and by
# local and master orchestrators.
#
# Each variant declares:
#   - Identification:  seed_year, seed_label, seed_description, seed_suffix
#   - Yield factors:   proportional yield change by farmer segment,
#                      keyed by segment name to decouple vector order from
#                      the segment_final factor levels.
#
# Segment keys are identical to the `segment_final` factor levels used in
# Script 02_03 (farmer segmentation). Any change to segment nomenclature
# must be reflected here and in the parametrized scripts simultaneously.
#
# Source: New Seed yield data and market analysis (November 2025).
# ==============================================================================

